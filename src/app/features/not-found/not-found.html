<div class="nf">
  <header class="nf-top"><app-logo [href]="home" /></header>
  <main class="nf-main">
    <div class="nf-bulbs" aria-hidden="true">
      @for (bulb of bulbs; track bulb) {
        <span></span>
      }
    </div>
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-h1">Cette séance n’existe pas.</h1>
    <p class="nf-text">
      Le lien est cassé ou la page a changé d’adresse. Rien de grave : le reste de la programmation
      t’attend.
    </p>
    <div class="nf-ctas">
      <app-button size="lg" [routerLink]="home">Retour à l’accueil</app-button>
    </div>
  </main>
</div>
